name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write # OIDC trusted publishing to npm

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # NOTE: no registry-url here — an auto-generated .npmrc conflicts
          # with @semantic-release/npm auth (documented EINVALIDNPMTOKEN trap)
      - run: npm ci
      # @25 required: bundles @semantic-release/npm v13 (OIDC trusted publishing);
      # v24's npm plugin v12 predates it and fails with ENONPMTOKEN
      - run: npx semantic-release@25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTHOG_TOKEN: ${{ secrets.POSTHOG_TOKEN }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
